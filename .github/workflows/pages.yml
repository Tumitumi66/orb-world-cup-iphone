name: Publish ball game
on:
  push:
    branches: ["主要的"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ball-game-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static game
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest icon-*.png ASSET-LICENSES.txt _site/
          touch _site/.nojekyll
          test -s _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Release stuck legacy deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/pages/deployments/c537082942e944efd38a7b262a71147d7672e7d0"
          status=$(gh api "$endpoint/status" --jq '.status' 2>/dev/null || true)
          echo "Legacy deployment status: $status"
          if [ "$status" = "updating_pages" ] || [ "$status" = "queued" ] || [ "$status" = "deployment_in_progress" ]; then
            gh api --method POST "$endpoint/cancel"
            sleep 5
            gh api "$endpoint/status" --jq '.status'
          fi
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
